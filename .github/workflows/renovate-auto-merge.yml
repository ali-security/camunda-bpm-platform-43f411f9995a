name: Renovate auto-merge
on:
  workflow_dispatch:

jobs:
  all-checks-passed:
    if: contains(github.event.pull_request.labels.*.name, 'automerge') && github.actor == 'renovate[bot]'
    name: All checks passed
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - uses: wechuli/allcheckspassed@v1.2.0
