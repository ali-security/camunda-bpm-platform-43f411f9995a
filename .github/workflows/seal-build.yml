name: Seal build - camunda-connect-connectors-all

# Upstream builds and tests on Jenkins (Jenkinsfile + .ci/config/stage-types.yaml:
# `install -Pdistro,distro-ce` on maven:3.9.7-eclipse-temurin-17); there is no
# GitHub Actions build/test workflow. This workflow builds connect/connectors-all
# (which shades connect-core, connect-http-client, connect-soap-http-client and
# httpclient5/httpcore5) and runs the surefire suites of the connect modules.

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional test selector passed to -Dtest'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.7

      - name: Build connectors-all and its reactor dependencies (no tests)
        run: >
          mvn -B -V install -Pdistro -pl connect/connectors-all -am
          -DskipTests -Dskip.frontend.build=true

      - name: Test connect modules (core, http-client, soap-http-client, connectors-all)
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn -B verify -Pdistro -pl connect/core,connect/http-client,connect/soap-http-client,connect/connectors-all \
              -Dskip.frontend.build=true \
              -Dtest='${{ inputs.test-filter }}' -Dsurefire.failIfNoSpecifiedTests=false
          else
            mvn -B verify -Pdistro -pl connect/core,connect/http-client,connect/soap-http-client,connect/connectors-all \
              -Dskip.frontend.build=true
          fi

      - name: Report test totals and skipped tests with reasons
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          tot = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          skips = []
          for mod in ("core", "http-client", "soap-http-client", "connectors-all"):
              m = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
              for f in sorted(glob.glob(f"connect/{mod}/target/surefire-reports/TEST-*.xml")):
                  r = ET.parse(f).getroot()
                  for k in m:
                      m[k] += int(r.get(k, 0) or 0)
                  for tc in r.iter("testcase"):
                      s = tc.find("skipped")
                      if s is not None:
                          msg = (s.get("message") or (s.text or "")).strip().replace("\n", " ")[:200]
                          skips.append(f"SKIPPED: {tc.get('classname')}.{tc.get('name')} -- {msg or 'no message given by runner'}")
              for k in tot:
                  tot[k] += m[k]
              print(f"connect/{mod}: tests={m['tests']} failures={m['failures']} errors={m['errors']} skipped={m['skipped']}")
          for s in skips:
              print(s)
          print(f"CONNECT TEST TOTAL: tests={tot['tests']} failures={tot['failures']} errors={tot['errors']} skipped={tot['skipped']} passed={tot['tests']-tot['failures']-tot['errors']-tot['skipped']}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: camunda-connect-connectors-all
          path: connect/connectors-all/target/camunda-connect-connectors-all-7.24.0.jar
          if-no-files-found: error
